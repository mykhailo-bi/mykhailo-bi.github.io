<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Acme Commerce</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <div class="topbar container">
        <a class="brand" href="index.html">Acme Commerce</a>
        <form class="search" role="search">
          <label class="sr-only" for="search-forgot">Search products</label>
          <input id="search-forgot" type="search" name="q" placeholder="Search products" aria-label="Search products">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <div class="top-actions">
          <a href="login.html" class="link-muted">Login</a>
          <a href="register.html" class="btn btn-ghost">Sign up</a>
        </div>
      </div>
      <nav class="primary-nav container" aria-label="Primary">
        <a href="catalog.html">Catalog</a>
        <a href="orders.html">Orders</a>
        <a href="account.html">Account</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container section auth-page" style="max-width:760px;">
    <div class="auth-card">
      <p class="eyebrow">Password reset</p>
      <h1>Send reset link</h1>
      <form class="stack" action="#">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <button class="btn btn-primary" type="submit">Send link</button>
      </form>
      <p class="muted">Remembered your password? <a class="link" href="login.html">Back to login</a></p>
    </div>
  </main>
</body>
</html>
