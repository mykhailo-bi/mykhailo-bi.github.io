<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Acme Commerce</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <div class="topbar container">
        <a class="brand" href="index.html">Acme Commerce</a>
        <form class="search" role="search">
          <label class="sr-only" for="search-account">Search products</label>
          <input id="search-account" type="search" name="q" placeholder="Search products" aria-label="Search products">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <div class="top-actions">
          <a href="login.html" class="link-muted">Login</a>
          <a href="register.html" class="btn btn-ghost">Sign up</a>
          <a href="cart.html" class="pill">Cart (2)</a>
        </div>
      </div>
      <nav class="primary-nav container" aria-label="Primary">
        <a href="catalog.html">Catalog</a>
        <a href="orders.html">Orders</a>
        <a class="active" href="account.html">Account</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container section account">
    <header class="section__header">
      <div>
        <p class="eyebrow">Account</p>
        <h1>Profile & settings</h1>
      </div>
      <a class="btn btn-ghost" href="#">Sign out</a>
    </header>

    <div class="grid grid-2">
      <section class="account-card" aria-label="Profile">
        <div class="card__header">Profile</div>
        <form class="stack" action="#">
          <div class="form-grid">
            <div>
              <label for="first-name">First name</label>
              <input id="first-name" name="first_name" value="Jane">
            </div>
            <div>
              <label for="last-name">Last name</label>
              <input id="last-name" name="last_name" value="Doe">
            </div>
          </div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="jane@example.com">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" value="+1 555 123 4567">
          <div class="card__footer">
            <button class="btn btn-primary" type="submit">Save</button>
          </div>
        </form>
      </section>

      <section class="account-card" aria-label="Addresses">
        <div class="card__header">Addresses</div>
        <div class="stack">
          <div class="card" style="padding:1rem;">
            <strong>Home</strong>
            <p class="muted">123 Market St, Berlin, 10115</p>
            <div class="actions-inline">
              <a class="link" href="#">Edit</a>
              <a class="link-muted" href="#">Remove</a>
            </div>
          </div>
          <a class="btn btn-ghost" href="#">Add address</a>
        </div>
      </section>
    </div>

    <section class="account-card" aria-label="Security">
      <div class="card__header">Security</div>
      <form class="stack" action="#">
        <label for="current-password">Current password</label>
        <input id="current-password" name="current_password" type="password">
        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" type="password">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm_password" type="password">
        <div class="card__footer">
          <button class="btn btn-primary" type="submit">Update password</button>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
