<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — Acme Commerce</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <div class="topbar container">
        <a class="brand" href="index.html">Acme Commerce</a>
        <form class="search" role="search">
          <label class="sr-only" for="search-wishlist">Search products</label>
          <input id="search-wishlist" type="search" name="q" placeholder="Search products" aria-label="Search products">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <div class="top-actions">
          <a href="login.html" class="link-muted">Login</a>
          <a href="register.html" class="btn btn-ghost">Sign up</a>
          <a href="cart.html" class="pill">Cart (1)</a>
        </div>
      </div>
      <nav class="primary-nav container" aria-label="Primary">
        <a href="catalog.html">Catalog</a>
        <a href="orders.html">Orders</a>
        <a href="account.html">Account</a>
        <a class="active" href="wishlist.html">Wishlist</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <header class="section__header">
      <div>
        <p class="eyebrow">Wishlist</p>
        <h1>Saved items</h1>
      </div>
      <a class="btn btn-ghost" href="catalog.html">Browse catalog</a>
    </header>

    <div class="grid grid-3">
      <article class="card product">
        <img src="https://picsum.photos/seed/4k-monitor-wishlist/320/220" alt="4K Monitor">
        <div class="card__body">
          <p class="label">Displays</p>
          <h3><a href="product.html">4K Monitor</a></h3>
          <p class="price">$449.00</p>
          <div class="actions-inline">
            <a class="btn btn-primary" href="product.html">Add to cart</a>
            <a class="btn btn-ghost" href="#">Remove</a>
          </div>
        </div>
      </article>
      <article class="card product">
        <img src="https://picsum.photos/seed/running-shoes-wishlist/320/220" alt="Running shoes">
        <div class="card__body">
          <p class="label">Footwear</p>
          <h3><a href="product.html">Running Shoes</a></h3>
          <p class="price">$129.00</p>
          <div class="actions-inline">
            <a class="btn btn-primary" href="product.html">Add to cart</a>
            <a class="btn btn-ghost" href="#">Remove</a>
          </div>
        </div>
      </article>
      <article class="card product">
        <img src="https://picsum.photos/seed/mechanical-keyboard-wishlist/320/220" alt="Mechanical keyboard">
        <div class="card__body">
          <p class="label">Accessories</p>
          <h3><a href="product.html">Mechanical Keyboard</a></h3>
          <p class="price">$159.00</p>
          <div class="actions-inline">
            <a class="btn btn-primary" href="product.html">Add to cart</a>
            <a class="btn btn-ghost" href="#">Remove</a>
          </div>
        </div>
      </article>
    </div>
  </main>

</body>
</html>
