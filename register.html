<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Acme Commerce</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <div class="topbar container">
        <a class="brand" href="index.html">Acme Commerce</a>
        <form class="search" role="search">
          <label class="sr-only" for="search-register">Search products</label>
          <input id="search-register" type="search" name="q" placeholder="Search products" aria-label="Search products">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <div class="top-actions">
          <a href="login.html" class="link-muted">Login</a>
          <a href="cart.html" class="pill">Cart</a>
        </div>
      </div>
      <nav class="primary-nav container" aria-label="Primary">
        <a href="catalog.html">Catalog</a>
        <a href="orders.html">Orders</a>
        <a href="account.html">Account</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container section auth-page" style="max-width:760px;">
    <div class="auth-card">
      <p class="eyebrow">Create account</p>
      <h1>Register</h1>
      <form class="stack" action="#">
        <div class="form-grid">
          <div>
            <label for="first-name">First name</label>
            <input id="first-name" name="first_name" required autocomplete="given-name">
          </div>
          <div>
            <label for="last-name">Last name</label>
            <input id="last-name" name="last_name" required autocomplete="family-name">
          </div>
        </div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" required autocomplete="new-password">
        <button class="btn btn-primary" type="submit">Create account</button>
      </form>
      <p class="muted">Already have an account? <a class="link" href="login.html">Login</a></p>
    </div>
  </main>
</body>
</html>
